[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zut-backend"
version = "0.1.0"
description = "Local and remote backend for Zotero Unified Translator"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "pypdf>=5.0,<6",
  "waitress>=3.0,<4",
  "pdf2zh-next==2.9.0",
  "tomlkit>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
